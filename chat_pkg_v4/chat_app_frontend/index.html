<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Delta AI Chat</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="page-header">
        <button onclick="newSession()">New Session</button>
    </div>

    <!-- Floating artifact panel (CSV/table viewer) -->
    <div id="artifact-overlay" class="hidden" onclick="closeArtifactPanel(event)">
        <div id="artifact-panel" onclick="event.stopPropagation()">
            <div id="artifact-panel-header">
                <div id="artifact-title">Artifact</div>
                <div id="artifact-actions">
                    <a id="artifact-download" href="#" target="_blank" rel="noopener">Download</a>
                    <button id="artifact-close" onclick="closeArtifactPanel()">Close</button>
                </div>
            </div>
            <div id="artifact-panel-body">
                <div id="artifact-meta"></div>
                <div id="artifact-table-container"></div>
            </div>
        </div>
    </div>

    <div id="chat-container">
        <div id="chat-messages"></div>
        <div id="chat-input">
            <input id="message-input" type="text" placeholder="Type your message...">
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="script.js"></script>
</body>
</html>
